name: EduLearn CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://edulearn:edulearn@localhost:5432/edulearn
      AUTH_SECRET: ci-only-session-secret-for-isolated-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edulearn
          POSTGRES_USER: edulearn
          POSTGRES_PASSWORD: edulearn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edulearn -d edulearn"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://edulearn:edulearn@localhost:5432/edulearn
      - run: pnpm db:seed
        env:
          DATABASE_URL: postgres://edulearn:edulearn@localhost:5432/edulearn
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
